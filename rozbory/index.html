<title>Rozbory zápasů</title>
<style>
:root { --bg: #333333; --panel: #3c3c3c; --ink: #f5f5f2; --muted: #b5b4ab; --accent: #ffd31a; --line: #525048; color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 "Space Grotesk", system-ui, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 40px 20px; display: grid; gap: 16px; }
h1 { margin: 0 0 8px; text-transform: uppercase; }
a.card { display: grid; gap: 4px; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); color: var(--ink); text-decoration: none; }
a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
a.card b { font-size: 1.15rem; } a.card span { color: var(--muted); font-size: .92rem; }
</style>
</head>
