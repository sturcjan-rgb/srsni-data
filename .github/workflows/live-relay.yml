name: live-relay
# Přeposílá živý FIBA data.json do větve "live", odkud ho highlights čtou přes
# raw.githubusercontent.com (FIBA sama CORS nepovoluje a veřejné CORS proxy nefungují).
on:
  workflow_dispatch:
    inputs:
      fiba_id:
        description: "FIBA ID zápasu (prázdné = dnešní zápas podle rozpisu)"
        required: false
  schedule:
    - cron: "*/10 14-21 * * *"
concurrency:
  group: live-relay
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - name: Najít zápas a přeposílat data
        env:
          FIBA_ID: ${{ github.event.inputs.fiba_id }}
        run: |
          set -u
          ID="${FIBA_ID:-}"
          if [ -z "$ID" ]; then
            # zápas, který začal před max. 3 h nebo začne do 20 min a ještě není dohraný
            ID=$(python3 - <<'PY'
          import json,glob,datetime as dt
          now=dt.datetime.now(dt.timezone.utc)
          for f in sorted(glob.glob('data/season-*.json'),reverse=True):
              for x in json.load(open(f)).get('fixtures',[]):
                  if not x.get('fibaMatchId') or x.get('status')=='final': continue
                  t=dt.datetime.fromisoformat(x['datetime'])
                  if t-dt.timedelta(minutes=20)<=now<=t+dt.timedelta(hours=3):
                      print(x['fibaMatchId']); raise SystemExit
          PY
          )
          fi
          if [ -z "$ID" ]; then echo "Žádný probíhající zápas."; exit 0; fi
          echo "Přeposílám zápas $ID"
          URL="https://fibalivestats.dcd.shared.geniussports.com/data/$ID/data.json"

          mkdir -p /tmp/live && cd /tmp/live && git init -q -b live
          git config user.name "srsni-bot"; git config user.email "bot@srsni.local"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # navázat na existující větev, ať zůstanou data předchozích zápasů (<id>.json slouží i po zápase)
          if git fetch -q --depth 1 origin live 2>/dev/null; then git reset -q --soft FETCH_HEAD && git checkout -q FETCH_HEAD -- . ; fi

          END=$(( $(date +%s) + 3*3600 )); ENDS=0
          while [ "$(date +%s)" -lt "$END" ]; do
            if curl -sf -m 10 -o /tmp/relay-new.json "$URL" && python3 -c "import json;d=json.load(open('/tmp/relay-new.json'));assert d.get('tm')" 2>/dev/null; then
              # raw.githubusercontent.com drží soubory v cache 5 min a parametry v URL ignoruje,
              # proto se data ukládají i do souboru podle 5s okna (ID/<epoch/5>.json): nové jméno = vždy čerstvé
              cp /tmp/relay-new.json "$ID.json"
              B=$(( $(date +%s) / 5 )); mkdir -p "$ID"; cp /tmp/relay-new.json "$ID/$B.json"
              # starší okna než 2 minuty pryč (jen číselné soubory v adresáři zápasu)
              python3 -c "import os,sys;d,b=sys.argv[1],int(sys.argv[2]);[os.remove(os.path.join(d,f)) for f in os.listdir(d) if f[:-5].isdigit() and int(f[:-5])<b-24]" "$ID" "$B"
              git add -A .
              # jediný commit (bez historie), force push → větev zůstává malá
              git commit -q --amend -m "live $ID $(date -u +%H:%M:%S)" 2>/dev/null || git commit -q -m "live $ID $(date -u +%H:%M:%S)"
              git push -q -f origin live 2>&1 | tail -1 || true
              if python3 -c "import json,sys;d=json.load(open('/tmp/relay-new.json'));sys.exit(0 if any(e.get('actionType')=='game' and e.get('subType')=='end' for e in d.get('pbp',[])) else 1)"; then
                ENDS=$((ENDS+1)); [ "$ENDS" -ge 12 ] && { echo "Zápas skončil."; break; }
              fi
            fi
            sleep 4
          done
