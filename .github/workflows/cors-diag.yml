name: cors-diag
on:
  push:
    branches: [claude/funny-planck-uad6x2]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Test FIBA a CORS proxy
        run: |
          U=https://fibalivestats.dcd.shared.geniussports.com/data/2890479/data.json
          for p in "$U" "https://api.codetabs.com/v1/proxy/?quest=$U" "https://corsproxy.io/?url=$U" "https://corsproxy.io/?$U" "https://api.allorigins.win/raw?url=$U" "https://cors.eu.org/$U" "https://thingproxy.freeboard.io/fetch/$U" "https://api.cors.lol/?url=$U" "https://everyorigin.jwvbremen.nl/api/get?url=$U" "https://proxy.corsfix.com/?$U" "https://cors-anywhere.com/$U"; do
            echo "=== $p"
            curl -s -m 15 -D h.txt -o b.txt -H 'Origin: https://sturcjan-rgb.github.io' -w 'HTTP %{http_code} %{size_download}B %{time_total}s\n' "$p" || echo "curl fail"
            grep -i '^access-control-allow-origin' h.txt || echo "  (bez ACAO)"
            head -c 120 b.txt; echo
          done
