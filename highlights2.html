<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Živé highlights 2 — Sršni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:"CoFo Peshka";src:url("assets/cofo-peshka-black.woff2") format("woff2");font-weight:400 900;font-display:block}
  :root{
    --bg:#333333;--panel:#5e5e5e;--line:rgba(255,211,27,0.16);
    --ink:#f5f5f2;--muted:#c7c7c2;
    --home:#ffd31a;--away:#9fb4c7;--good:#3ecf6e;--bad:#ef5757;--court:#292929;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 16px 40px}
  .hidden{display:none!important}

  header.site-header{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  header.site-header .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px;padding-top:0;padding-bottom:0}
  .logo{font-weight:900;font-size:1.4rem;letter-spacing:.01em;color:var(--home);text-transform:uppercase;text-decoration:none;white-space:nowrap}
  .logo span{color:var(--ink)}
  nav.main-nav{min-width:0;display:flex;gap:1.4rem;font-weight:700;text-transform:uppercase;font-size:.85rem;letter-spacing:.03em;overflow-x:auto}
  nav.main-nav a{color:var(--muted);text-decoration:none;transition:color .15s;white-space:nowrap}
  nav.main-nav a:hover,nav.main-nav a.active{color:var(--home)}

  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);padding:14px 16px;margin-bottom:18px}
  .bar label.lb{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
  .bar select,.bar input[type=text]{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:9px 11px;font-size:14px;font-family:'Space Grotesk'}
  .bar select#matchSelect{min-width:0;flex:1 1 300px;max-width:460px}
  .bar input#gid{width:120px}
  .btn{background:var(--home);color:#221a00;border:0;padding:10px 16px;font-family:'Space Grotesk',system-ui,sans-serif;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--ink)}
  .chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}
  .chk input{accent-color:var(--home)}
  .upload{border:1px solid var(--line);padding:9px 14px;cursor:pointer;color:var(--home);font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.02em}
  .hint{color:var(--muted);font-size:13px;flex-basis:100%}
  .err{color:var(--bad);font-size:13px;flex-basis:100%}
  .err a{color:var(--home)}

  .status{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--court);border:1px solid var(--line);padding:12px 16px;margin-bottom:18px}
  .status .sc{font-family:'CoFo Peshka','Arial Black',sans-serif;font-weight:900;font-size:30px;line-height:1;white-space:nowrap}
  .status .sc .us{color:var(--home)}
  .status .clk{color:var(--muted);font-weight:700}
  .pill{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border:1px solid var(--line);color:var(--muted)}
  .pill.live{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .status .fmt{margin-left:auto;display:flex;gap:6px}
  .status .fmt button{background:var(--bg);border:1px solid var(--line);color:var(--muted);padding:6px 10px;font-family:'Space Grotesk',system-ui,sans-serif;font-size:13px;font-weight:700;cursor:pointer}
  .status .fmt button.on{color:#221a00;background:var(--home);border-color:var(--home)}

  .feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;position:relative}
  .card.fresh{outline:2px solid var(--home);outline-offset:-2px}
  .card .badge{position:absolute;top:10px;left:10px;background:var(--home);color:#221a00;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;z-index:2}
  .card canvas{width:100%;height:auto;display:block;background:var(--court)}
  .card .body{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
  .card .meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .card textarea{width:100%;min-height:118px;resize:vertical;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:8px 10px;font-family:'Space Grotesk',system-ui,sans-serif;font-size:13px;line-height:1.45}
  .card .acts{display:flex;gap:6px;flex-wrap:wrap}
  .card .acts .btn{padding:8px 12px;font-size:13px;flex:1}
  .empty{color:var(--muted);text-align:center;padding:40px 16px;border:1px dashed var(--line)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--home);color:#221a00;font-weight:700;padding:10px 18px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
  @media (max-width:640px){
    nav.main-nav{gap:.9rem;font-size:.75rem}
    .status .sc{font-size:24px;white-space:normal}
    .status .fmt{margin-left:0}
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap topbar">
    <a class="logo" href="index.html">🐝 SRŠNI <span>DATA</span></a>
    <nav class="main-nav">
      <a href="index.html">Live rozbor</a>
      <a href="highlights.html">Highlights</a>
      <a href="highlights2.html" class="active">Highlights 2</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="https://sturcjan-rgb.github.io/srsni-truth/" target="_blank">Portál</a>
    </nav>
  </div>
</header>
<div class="wrap">

  <div class="bar">
    <label class="lb" for="matchSelect">Zápas</label>
    <select id="matchSelect"><option value="">Načítám seznam zápasů…</option></select>
    <input id="gid" type="text" inputmode="numeric" placeholder="nebo FIBA ID">
    <button class="btn" id="load">Načíst</button>
    <label class="chk"><input type="checkbox" id="liveToggle"> živě (3 s)</label>
    <label class="chk"><input type="checkbox" id="showOpp"> i momenty soupeře</label>
    <label class="upload">Nahrát data.json<input id="file" type="file" accept=".json,application/json" hidden></label>
    <button class="btn ghost" id="notifyBtn">🔔 Upozornění</button>
    <span class="hint" id="hint">Vyber zápas. Během zápasu se živé sledování zapne samo a nové momenty naskočí nahoru, hotové ke sdílení.</span>
    <div class="err hidden" id="err"></div>
  </div>

  <div class="status hidden" id="status">
    <span class="pill" id="stPill">—</span>
    <span class="sc" id="stScore"></span>
    <span class="clk" id="stClock"></span>
    <span class="fmt" id="fmt">
      <button data-f="story" class="on">1080×1920</button>
    </span>
  </div>

  <div class="feed" id="feed"></div>
  <div class="empty hidden" id="empty">Zatím žádný moment. Série, obraty a milníky hráčů se tu objeví, jakmile nastanou.</div>
</div>

<script src="highlights-engine.js?v=20260927e"></script>
<script>
const $=id=>document.getElementById(id);
const FORMATS={post:{w:1080,h:1350},story:{w:1080,h:1920}};
const POLL_MS=3000;

let DATA=null, RESULT=null, currentId=null, liveTimer=null, format='story';
let firstLoad=true, unseen=0;
const rendered=new Map();   // id -> {el, version}

/* ---------- načítání (stejné zdroje jako Live rozbor) ---------- */
function showErr(m){
  const e=$('err');
  if(!m){e.classList.add('hidden');e.textContent='';return;}
  e.classList.remove('hidden');
  const url=(m.match(/https?:\/\/\S+/)||[])[0];
  e.textContent=url?m.replace(url,''):m;
  if(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.textContent='otevřít data.json ↗';e.appendChild(a);}
}
function mojiScore(s){return (s.match(/Ã.|Å.|Â.|â€|Ä.|Ð/g)||[]).length;}
function fixText(s){const b=mojiScore(s);if(!b)return s;let f;try{f=new TextDecoder('utf-8').decode(Uint8Array.from([...s].map(c=>c.charCodeAt(0)&0xff)));}catch(e){return s;}return (mojiScore(f)<b&&!(f.includes('�')&&!s.includes('�')))?f:s;}
function decodeParse(input){const t=typeof input==='string'?input:new TextDecoder('utf-8').decode(input);return JSON.parse(fixText(t));}

const SEASON_URLS=[
  'https://raw.githubusercontent.com/sturcjan-rgb/srsni-data/main/data/season-2026-27.json',
  'https://raw.githubusercontent.com/sturcjan-rgb/srsni-data/main/data/season-2025-26.json'
];
const MATCHES={};

function stopLive(){ if(liveTimer){clearInterval(liveTimer);liveTimer=null;} $('liveToggle').checked=false; }
let polling=false;   // pomalá proxy nesmí vrstvit souběžné dotazy
function startLive(){ if(liveTimer) return; $('liveToggle').checked=true; liveTimer=setInterval(()=>{
  if(!currentId || polling) return;
  polling=true; loadById(currentId,true).finally(()=>{ polling=false; });
},POLL_MS); }
function maybeAutoLive(id){
  const f=MATCHES[id];
  if(!f){ stopLive(); return; }
  const start=new Date(f.datetime).getTime(), now=Date.now();
  const inWindow=f.status!=='final' && now>=start-15*60000 && now<=start+3*3600000;
  if(inWindow) startLive(); else stopLive();
}

async function loadMatchList(){
  const seasons=await Promise.all(SEASON_URLS.map(async u=>{
    try{ const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0; return await r.json(); }
    catch(e){ return null; }
  }));
  let html='<option value="">— vyber zápas —</option>', current=[];
  seasons.forEach((season,i)=>{
    if(!season) return;
    const list=(season.fixtures||[]).filter(f=>f.fibaMatchId).sort((a,b)=>new Date(a.datetime)-new Date(b.datetime));
    if(!list.length) return;
    list.forEach(f=>MATCHES[String(f.fibaMatchId)]=f);
    if(i===0) current=list;
    html+='<optgroup label="Sezóna '+season.season+(i?' (archiv)':'')+'">'+list.map(f=>{
      const d=f.date.split('-').reverse().join('.')+'.';
      return `<option value="${f.fibaMatchId}">${f.round} · ${d} · ${f.home} – ${f.away}${f.status==='final'?' ✓':''}</option>`;
    }).join('')+'</optgroup>';
  });
  $('matchSelect').innerHTML=html;
  if(!current.length){ $('hint').textContent='Seznam zápasů se nepodařilo načíst nebo nemá FIBA ID — zadej ID ručně.'; return; }
  // výchozí: probíhající zápas, jinak poslední odehraný
  const now=Date.now();
  const live=current.find(f=>f.status!=='final' && now>=new Date(f.datetime).getTime()-15*60000 && now<=new Date(f.datetime).getTime()+3*3600000);
  const past=current.filter(f=>new Date(f.datetime).getTime()<=now);
  const pick=live||past[past.length-1]||current[0];
  const id=String(pick.fibaMatchId);
  $('matchSelect').value=id; $('gid').value=id;
  selectMatch(id);
}

function selectMatch(id){
  firstLoad=true; rendered.clear(); $('feed').innerHTML=''; unseen=0; updateTitle();
  loadById(id,false); maybeAutoLive(id);
}

// Zdroje živých dat. FIBA sama CORS nepovoluje, proto přes proxy; zkouší se všechny naráz.
const LIVE_SOURCES=[
  u=>u,
  u=>'https://api.codetabs.com/v1/proxy/?quest='+u,
  u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
];
async function fetchJson(u,ms=8000){
  const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),ms);
  try{
    const r=await fetch(u,{cache:'no-store',signal:ac.signal}); if(!r.ok) throw new Error(r.status);
    const j=decodeParse(await r.arrayBuffer()); if(!j.tm||!j.pbp) throw new Error('bad json');
    return j;
  } finally { clearTimeout(t); }
}

// Vlastní přeposílač (workflow live-relay → větev „live“, GitHub CORS povoluje). Data jsou v souborech
// po 5s oknech (<id>/<epoch/5>.json) — nové jméno souboru obchází 5min cache raw.githubusercontent.com.
// Zkouší okna 10–25 s zpět (mladší ještě nemusí být nahraná) a bere nejnovější, které existuje.
async function fetchRelay(id){
  const RAW='https://raw.githubusercontent.com/sturcjan-rgb/srsni-data/live/';
  const b=Math.floor(Date.now()/5000);
  for(let k=2;k<=5;k++){
    try{ return await fetchJson(RAW+id+'/'+(b-k)+'.json',4000); }catch(e){}
  }
  throw new Error('relay');
}

async function loadById(id,silent){
  if(!/^\d+$/.test(id)){ showErr('Zadej platné ID zápasu (jen čísla).'); return; }
  currentId=id;
  if(!silent){ showErr(''); $('hint').textContent='Načítám…'; }
  const archive=`https://sturcjan-rgb.github.io/srsni-truth/matches/${id}.json`;
  const live=`https://fibalivestats.dcd.shared.geniussports.com/data/${id}/data.json`;
  const liveTries=LIVE_SOURCES.map(fn=>fn(live,id));
  const f=MATCHES[id];
  // probíhající zápas: živé zdroje, jinak nejdřív archiv (rychlý, bez proxy)
  const preferLive=silent || (f && f.status!=='final');
  const RELAY='relay';
  const livePlus=[RELAY,...liveTries];
  const groups=preferLive?[livePlus,[archive]]:[[archive],livePlus];
  for(const g of groups){
    try{
      // všechny zdroje ve skupině naráz, vyhrává první platná odpověď
      const {j,u}=await Promise.any(g.map(u=>(u===RELAY?fetchRelay(id):fetchJson(u)).then(j=>({j,u}))));
      if(id!==currentId) return;              // mezitím vybrán jiný zápas
      ingest(j);
      $('hint').textContent=(silent?'Aktualizováno':'Načteno')+' ('+(u===archive?'archiv srsni-truth':'živě · '+(u===RELAY?'přeposílač':new URL(u).hostname))+') · ID '+id+' · '+new Date().toLocaleTimeString('cs-CZ');
      showErr(''); return;
    }catch(e){}
  }
  if(silent){ $('hint').textContent='Živá data se teď nepodařilo obnovit, zkouším znovu… ('+new Date().toLocaleTimeString('cs-CZ')+')'; return; }
  $('hint').textContent='';
  showErr('Nepodařilo se načíst ID '+id+' ani z archivu, ani živě. Otevři odkaz, ulož ho a nahraj přes „Nahrát data.json": '+live);
}

/* ---------- zpracování ---------- */
function ingest(d){
  DATA=d;
  RESULT=SrsniHighlights.analyze(d);
  if(RESULT.meta.finished) stopLive();
  drawStatus();
  drawFeed();
  firstLoad=false;
}

function drawStatus(){
  const m=RESULT.meta, n=m.now;
  $('status').classList.remove('hidden');
  const pill=$('stPill');
  const live=!m.finished && (n.el>0);
  pill.textContent=m.finished?'Konec':(live?'Live':'Před zápasem');
  pill.className='pill'+(live?' live':'');
  const cls=t=>t===m.us?'us':'';
  $('stScore').innerHTML=`<span class="${cls(1)}"></span> <span class="${cls(2)}"></span>`;
  const sp=$('stScore').children;
  sp[0].textContent=m.home.short+' '+m.score[1];
  sp[1].textContent=': '+m.score[2]+' '+m.away.short;
  sp[1].className=cls(2);
  $('stClock').textContent=m.finished?'Konečný stav':n.clock;
}

function visible(){
  const all=$('showOpp').checked;
  return RESULT.highlights.filter(h=>all||h.ours||h.type==='mvp');
}

function drawFeed(){
  const list=visible().slice().sort((a,b)=>(a.type==='mvp')-(b.type==='mvp')||b.el-a.el||b.action-a.action);
  // mvp karta patří nahoru jen po konci zápasu
  if(RESULT.meta.finished){ const i=list.findIndex(h=>h.type==='mvp'); if(i>0) list.unshift(list.splice(i,1)[0]); }
  const feed=$('feed');
  const keep=new Set(list.map(h=>h.id));
  for(const [id,r] of rendered) if(!keep.has(id)){ r.el.remove(); rendered.delete(id); }
  let fresh=0;
  list.forEach((h,idx)=>{
    let r=rendered.get(h.id);
    if(!r){
      r={el:makeCard(h),version:null};
      rendered.set(h.id,r);
      if(!firstLoad && h.type!=='mvp'){ r.el.classList.add('fresh'); r.el.querySelector('.badge').classList.remove('hidden'); fresh++; }
    }
    if(r.version!==h.version){
      if(r.version && !firstLoad && h.type!=='mvp'){ r.el.classList.add('fresh'); const b=r.el.querySelector('.badge'); b.textContent='Aktualizováno'; b.classList.remove('hidden'); }
      fillCard(r.el,h); r.version=h.version;
    }
    if(feed.children[idx]!==r.el) feed.insertBefore(r.el,feed.children[idx]||null);
  });
  $('empty').classList.toggle('hidden',list.length>0);
  if(fresh) announce(fresh,list.find(h=>rendered.get(h.id).el.classList.contains('fresh')));
}

function announce(n,h){
  unseen+=n; updateTitle();
  toast(n===1?'Nový moment: '+h.kicker+' — '+h.title:n+' nové momenty');
  if('Notification' in window && Notification.permission==='granted' && document.hidden){
    try{ new Notification('🐝 '+h.kicker,{body:h.title+' · '+h.sub}); }catch(e){}
  }
}
function updateTitle(){ document.title=(unseen?'('+unseen+') ':'')+'Živé highlights 2 — Sršni'; }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ unseen=0; updateTitle(); } });
let toastT=null;
function toast(msg){
  let t=document.querySelector('.toast');
  if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),4000);
}

/* ---------- karta v UI ---------- */
function makeCard(h){
  const el=document.createElement('div');
  el.className='card';
  el.innerHTML=`<span class="badge hidden">Nové</span>
    <canvas></canvas>
    <div class="body">
      <div class="meta"><span class="k"></span><span class="c"></span></div>
      <textarea spellcheck="false" aria-label="Text příspěvku"></textarea>
      <div class="acts">
        <button class="btn" data-a="share">Sdílet</button>
        <button class="btn ghost" data-a="png">Stáhnout PNG</button>
        <button class="btn ghost" data-a="copy">Kopírovat text</button>
      </div>
    </div>`;
  el.querySelector('textarea').addEventListener('input',e=>{ e.target.dataset.edited='1'; });
  el.addEventListener('click',e=>{
    el.classList.remove('fresh'); el.querySelector('.badge').classList.add('hidden');
    const a=e.target.dataset&&e.target.dataset.a; if(!a) return;
    const h=el._h;
    if(a==='copy') copyText(el.querySelector('textarea').value);
    if(a==='png') download(el,h);
    if(a==='share') share(el,h);
  });
  if(!(navigator.canShare)) el.querySelector('[data-a=share]').classList.add('hidden');
  return el;
}
function fillCard(el,h){
  el._h=h;
  el.querySelector('.k').textContent=h.kicker;
  el.querySelector('.c').textContent=h.type==='mvp'&&h.final?'Konec':h.clock;
  const ta=el.querySelector('textarea');
  if(!ta.dataset.edited) ta.value=h.caption;
  drawCanvas(el.querySelector('canvas'),h);
}

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('Text zkopírován'); }
  catch(e){ toast('Kopírování se nepovedlo — označ text ručně'); }
}
function fileName(h){ return 'srsni2-'+currentId+'-'+h.id+'.png'; }
function toBlob(c){ return new Promise(r=>c.toBlob(r,'image/png')); }
async function download(el,h){
  const blob=await toBlob(el.querySelector('canvas'));
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fileName(h);
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function share(el,h){
  const text=el.querySelector('textarea').value;
  // Instagram text ze sdílení zahazuje → dej ho rovnou do schránky
  try{ await navigator.clipboard.writeText(text); }catch(e){}
  const file=new File([await toBlob(el.querySelector('canvas'))],fileName(h),{type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],text}); toast('Text je ve schránce — vlož ho k příspěvku'); }
    catch(e){ if(e.name!=='AbortError') download(el,h); }
  } else download(el,h);
}

/* ---------- grafika 2 (podle návrhu highlights.fig, verze „sykora“) ---------- */
const C_BG='#434548', C_YEL='#ffd11c', C_BLACK='#000000', C_WHITE='#ffffff';
const PESHKA='"CoFo Peshka", "Arial Black", sans-serif';
const MONT='Montserrat, "Arial", sans-serif';
// Návrh je v CoFo Peshka Bold (550); v repu je Black, který je širší → velikosti ×0,84, aby šířky seděly s Figmou
const PK=0.84;
// Bezpečná oblast pro text: levý sloupec mezi okrajem a fotkou, svisle mimo horní/spodní lištu Instagramu
const SAFE={x:138, right:790, top:250, bottom:1670};
const DECOR=new Image(); DECOR.src='assets/h2-decor.svg';
// výchozí pozadí (bez hráče) — když chybí, kreslí se pozadí + pruhy z návrhu
const DEFAULT_BG=new Image(); DEFAULT_BG.src='assets/hraci/default.png';

/* fotky hráčů: assets/hraci/jmeno-prijmeni.png (bez diakritiky). Podle příjmení jen když je v soupisce jediné
   — Svobodové (Martin, Josef) a Zvolánkové (Jakub, Marek) se tak nepletou. */
const PHOTO_EXT=['png','webp','jpg'];
const photoCache=new Map();   // klíč -> {img|null, pending}
const slug=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
// klíč podle jména, ne podle pno: pořadová čísla hráčů se mezi zápasy liší
function photoKey(p){ return slug(p.name||p.family||'') || (p.tno+'-'+p.pno); }
// assets/hraci/hraci.json: přesné přiřazení souborů hráčům (např. svoboda-m.png → Martin Svoboda)
let PHOTO_MAP={};
const photoMapReady=fetch('assets/hraci/hraci.json',{cache:'no-cache'}).then(r=>r.ok?r.json():{}).then(j=>{PHOTO_MAP=j||{};}).catch(()=>{});
function photoCandidates(p){
  const tm=DATA&&DATA.tm[String(p.tno)]; const pl=(tm&&tm.pl&&tm.pl[String(p.pno)])||{};
  const first=pl.firstName||'', fam=pl.familyName||p.family||'';
  const full=slug(first+' '+fam);
  if(PHOTO_MAP[full]) return PHOTO_MAP[full]==='default.png'?[]:['assets/hraci/'+PHOTO_MAP[full]];
  const names=[full, slug(fam+' '+first.slice(0,1))];
  const sameFamily=tm?Object.values(tm.pl||{}).filter(x=>slug(x.familyName)===slug(fam)).length:1;
  if(sameFamily===1) names.push(slug(fam));
  return names.flatMap(n=>PHOTO_EXT.map(e=>'assets/hraci/'+n+'.'+e));
}
function loadImage(src){ return new Promise(res=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; }); }
function playerPhoto(p){
  if(!p||p.tno!==RESULT.meta.us) return null;          // fotky máme jen Sršňů
  const k=photoKey(p); const c=photoCache.get(k);
  if(c) return c.img;
  const entry={img:null}; photoCache.set(k,entry);
  (async()=>{ await photoMapReady; for(const src of photoCandidates(p)){ const img=await loadImage(src); if(img){ img._safeRight=measureSafeRight(img); entry.img=img; redrawPlayer(k); return; } } })();
  return null;
}
function redrawPlayer(k){
  for(const r of rendered.values()){ const h=r.el._h; if(h&&h.photoPlayer&&photoKey(h.photoPlayer)===k) drawCanvas(r.el.querySelector('canvas'),h); }
}

// Kde na fotce začíná hráč (první „barevný“ pixel zleva v pásu s texty) → text musí skončit před ním.
// Pozadí, stín a šedé/bílé pruhy nejsou syté barvy, hráč (dres, kůže, vlasy, míč) ano.
function measureSafeRight(img){
  try{
    const W=1080,H=1920,y0=480,y1=1400,step=4;
    const c=document.createElement('canvas'); c.width=W; c.height=H;
    const x=c.getContext('2d'); x.drawImage(img,0,0,W,H);
    const d=x.getImageData(0,y0,W,y1-y0).data;
    let left=W;
    for(let y=0;y<y1-y0;y+=step){
      for(let px=SAFE.x;px<left;px+=step){
        const i=(y*W+px)*4, r=d[i],g=d[i+1],b=d[i+2], mx=Math.max(r,g,b), mn=Math.min(r,g,b);
        if(mx>90 && (mx-mn)/mx>0.28){ left=px; break; }
      }
    }
    return Math.max(SAFE.x+360, Math.min(SAFE.right, left-30));
  }catch(e){ return SAFE.right; }
}

function setFont(ctx,fam,size){ ctx.font=(fam===MONT?'700 ':'')+size+'px '+fam; }
function fitSize(ctx,fam,text,maxW,size,min){
  let s=size; setFont(ctx,fam,s);
  while(s>min && ctx.measureText(text).width>maxW){ s-=2; setFont(ctx,fam,s); }
  return s;
}
function midText(ctx,text,x,y){          // verzálky svisle na střed y
  const capH=ctx.measureText('H').actualBoundingBoxAscent;
  ctx.fillText(text,x,y+capH/2);
}
function wrapLines(ctx,text,maxW){
  const words=text.split(' '), lines=[]; let cur='';
  for(const w of words){ const t=cur?cur+' '+w:w; if(ctx.measureText(t).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=t; }
  if(cur) lines.push(cur); return lines;
}

// fotka: výřez hráče vpravo (x 809–1080), výška 1858 px jako ve Figmě, se stínem doleva.
// Když je nahraný obrázek rovnou celé pozadí 1080×1920 (poměr 9:16), použije se přes celou plochu.
function drawPhoto(ctx,img,W,H){
  const ratio=img.naturalWidth/img.naturalHeight;
  if(Math.abs(ratio-W/H)<0.03){ ctx.drawImage(img,0,0,W,H); return 'full'; }
  const ph=1858, pw=ph*ratio, px=809, py=162-0.0125*ph;
  const off=document.createElement('canvas'); off.width=W; off.height=H;
  const o=off.getContext('2d');
  o.save(); o.beginPath(); o.rect(px,162,W-px,1758); o.clip(); o.drawImage(img,px,py,pw,ph); o.restore();
  ctx.save(); ctx.shadowColor='rgba(0,0,0,1)'; ctx.shadowBlur=92; ctx.shadowOffsetX=-100; ctx.shadowOffsetY=4;
  ctx.drawImage(off,0,0); ctx.restore();
  return 'cutout';
}

function drawCanvas(c,h){
  const W=1080, H=1920;
  c.width=W; c.height=H;
  const ctx=c.getContext('2d');
  const m=RESULT.meta, cd=h.card, X=SAFE.x;

  ctx.fillStyle=C_BG; ctx.fillRect(0,0,W,H);
  const img=playerPhoto(h.photoPlayer);
  const maxW=((img&&img._safeRight)||SAFE.right)-SAFE.x;
  let photoMode=null;
  if(img&&Math.abs(img.naturalWidth/img.naturalHeight-W/H)<0.03) photoMode=drawPhoto(ctx,img,W,H);
  else if(!img&&DEFAULT_BG.complete&&DEFAULT_BG.naturalWidth) ctx.drawImage(DEFAULT_BG,0,0,W,H);
  else {
    if(DECOR.complete&&DECOR.naturalWidth) ctx.drawImage(DECOR,0,0,W,H);
    if(img) photoMode=drawPhoto(ctx,img,W,H);
  }
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';

  // čas: černý štítek, „Q4“ bíle, čas žlutě
  const final=h.type==='mvp'&&h.final;
  const [per,clk]=final?['KONEC','']:h.clock.split(' · ');
  setFont(ctx,MONT,49);
  const gap=clk?ctx.measureText('  ').width:0;
  const tw=ctx.measureText(per).width+gap+(clk?ctx.measureText(clk).width:0);
  const bw=Math.max(294,tw+62);
  ctx.fillStyle=C_BLACK; ctx.fillRect(120,486,bw,95);
  ctx.fillStyle=C_WHITE; midText(ctx,per,151,534);
  if(clk){ ctx.fillStyle=C_YEL; midText(ctx,clk,151+ctx.measureText(per).width+gap,534); }

  // štítek (černě) — každé slovo na vlastní řádek; další prvky se posunou dolů
  const words=cd.label.toUpperCase().split(/\s+/).filter(Boolean);
  const longest=words.reduce((a,w)=>{ setFont(ctx,PESHKA,100); return ctx.measureText(w).width>ctx.measureText(a).width?w:a; },'');
  ctx.fillStyle=C_BLACK; const ls=fitSize(ctx,PESHKA,longest,maxW,Math.round(121*PK),50);
  const lhL=ls/PK;
  words.forEach((w,i)=>midText(ctx,w,X,692+i*lhL));
  const shift=(words.length-1)*lhL;

  // velké číslo (bíle)
  ctx.fillStyle=C_WHITE; fitSize(ctx,PESHKA,cd.big,maxW,Math.round(229*PK),110);
  midText(ctx,cd.big,X,868+shift);

  // řádek (žlutě) — max 3 řádky v šířce 604 px a musí skončit nad skóre, jinak se zmenší
  const line=(cd.line||'').toUpperCase();
  const top=990+shift, limit=1375;
  let size=Math.round(86*PK), lines, lh;
  for(;;){ setFont(ctx,PESHKA,size); lines=wrapLines(ctx,line,Math.min(604,maxW)); lh=100*size/(86*PK);
    if((lines.length<=3&&top+lines.length*lh<=limit&&lines.every(l=>ctx.measureText(l).width<=maxW))||size<=32) break; size-=2; }
  ctx.fillStyle=C_YEL;
  lines.slice(0,3).forEach((ln,i)=>midText(ctx,ln,X,top+lh/2+i*lh));

  // skóre: nahoře Sršni, dole soupeř; žlutě vždy ten, kdo vede (při remíze obě bíle)
  const us=m.us, them=m.them;
  const sc={[us]:us===1?h.s1:h.s2,[them]:them===1?h.s1:h.s2};
  const col=t=>sc[t]>sc[t===us?them:us]?C_YEL:C_WHITE;
  const rows=[[1395,us,col(us)],[1541,them,col(them)]];
  setFont(ctx,PESHKA,Math.round(66*PK));
  fitSize(ctx,PESHKA,String(Math.max(sc[us],sc[them])),110,Math.round(66*PK),36);
  const numFont=ctx.font;
  for(const [y,t,col] of rows){
    ctx.fillStyle=C_BLACK; ctx.fillRect(X,y,132,132);
    ctx.font=numFont; ctx.fillStyle=col; ctx.textAlign='center'; midText(ctx,String(sc[t]),X+66,y+66);
    ctx.textAlign='left'; ctx.fillStyle=C_WHITE;
    const lbl=m.teams[t].label.toUpperCase();
    fitSize(ctx,MONT,lbl,(photoMode?X+maxW:W-60)-(X+166),30,18); midText(ctx,lbl,X+166,y+66);
  }
}

/* ---------- ovládání ---------- */
$('matchSelect').onchange=e=>{ if(e.target.value){ $('gid').value=e.target.value; selectMatch(e.target.value); } };
$('load').onclick=()=>{ const id=$('gid').value.trim(); selectMatch(id); };
$('gid').addEventListener('keydown',e=>{ if(e.key==='Enter') $('load').click(); });
$('liveToggle').onchange=()=>{ $('liveToggle').checked?startLive():stopLive(); };
$('showOpp').onchange=()=>{ if(RESULT) drawFeed(); };
$('fmt').addEventListener('click',e=>{
  const f=e.target.dataset.f; if(!f) return;
  format=f; $('fmt').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));
  for(const r of rendered.values()) if(r.el._h) drawCanvas(r.el.querySelector('canvas'),r.el._h);
});
$('file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const j=decodeParse(r.result); if(!j.tm||!j.pbp) throw new Error('nevypadá to jako FIBA data.json');
      stopLive(); currentId='soubor'; firstLoad=true; rendered.clear(); $('feed').innerHTML=''; ingest(j);
      $('hint').textContent='Načteno ze souboru '+f.name+'.'; showErr(''); }
    catch(err){ showErr('Soubor se nepodařilo přečíst: '+err.message); } };
  r.readAsArrayBuffer(f);
};
if(!('Notification' in window)) $('notifyBtn').classList.add('hidden');
$('notifyBtn').onclick=async()=>{
  const p=await Notification.requestPermission();
  toast(p==='granted'?'Upozornění zapnutá — přijdou i na pozadí':'Upozornění nejsou povolená');
};

// grafika potřebuje načtený font, jinak se vykreslí náhradním písmem
Promise.all(['100px "CoFo Peshka"','700 30px Montserrat'].map(f=>document.fonts.load(f,'ŠČŘŽÝÁÍÉ0123456789').catch(()=>{}))
  .concat([DECOR,DEFAULT_BG].map(im=>new Promise(r=>{ if(im.complete) r(); else { im.onload=im.onerror=r; } }))))
  .then(()=>{ if(RESULT) for(const r of rendered.values()) drawCanvas(r.el.querySelector('canvas'),r.el._h); });

loadMatchList();
</script>
