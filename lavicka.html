<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sršni Lavička — live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#262626;--panel:#333333;--panel-2:#3d3d3d;--line:#4c4a44;--ink:#f7f7f3;--muted:#b9b8b0;
    --us:#ffd31a;--them:#9fc2e0;--good:#44d97a;--bad:#ff5c5c;--warn:#ffab3d;--court:#2b2b2b;--court-line:#77756c;--miss:#9d9c95;
    --f-body:"Space Grotesk","Segoe UI",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  html{font-size:clamp(15px,.98vw,21px)}
  body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow:hidden}
  .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
  .us{color:var(--us)} .them{color:var(--them)}
  .pos{color:var(--good)} .neg{color:var(--bad)} .mut{color:var(--muted)}

  .app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:.6rem;padding:.6rem .8rem .8rem}

  /* ovládání */
  .ctl{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
  .ctl .logo{font-weight:700;color:var(--us);text-transform:uppercase;text-decoration:none;font-size:.95rem;margin-right:.4rem}
  .ctl .logo span{color:var(--ink)}
  .ctl select,.ctl input{background:var(--panel);border:1px solid var(--line);color:var(--ink);font:500 .8rem var(--f-body);padding:.3rem .5rem;border-radius:0;min-height:2rem}
  .ctl select{max-width:26rem}
  .ctl input{width:7rem}
  .ctl button,.seg button{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);font:600 .78rem var(--f-body);padding:.3rem .7rem;cursor:pointer;border-radius:0;min-height:2rem}
  .ctl button:hover,.seg button:hover{border-color:var(--us)}
  .seg{display:flex;gap:3px}
  .seg button.on{background:var(--us);border-color:var(--us);color:#222}
  .seg button.on.t{background:var(--them);border-color:var(--them);color:#10161c}
  .status{margin-left:auto;display:flex;align-items:center;gap:.4rem;font-family:var(--f-mono)}
  .status i{width:.6rem;height:.6rem;border-radius:50%;background:var(--miss)}
  .status.live i{background:var(--bad);box-shadow:0 0 0 0 rgba(255,92,92,.7);animation:pulse 1.6s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 .5rem rgba(255,92,92,0)}100%{box-shadow:0 0 0 0 rgba(255,92,92,0)}}
  .ctl a.back{color:var(--muted)}

  /* tabule */
  .board{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;background:var(--panel);border-top:4px solid var(--us)}
  .bt{display:flex;align-items:center;gap:1rem;padding:.5rem 1rem;min-width:0}
  .bt.r{flex-direction:row-reverse;text-align:right}
  .bt .nm{font-weight:700;text-transform:uppercase;font-size:1.25rem;line-height:1.05;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bt .sc{font:700 3.4rem/1 var(--f-mono)}
  .bt .meta{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:.3rem;font-size:.82rem;color:var(--muted)}
  .bt.r .meta{justify-content:flex-end}
  .bt .meta b{color:var(--ink);font-family:var(--f-mono)}
  .tf{display:inline-flex;gap:3px;vertical-align:middle;margin-left:.3rem}
  .tf i{width:.75rem;height:.75rem;border:1.5px solid var(--muted)}
  .tf i.on{background:var(--ink);border-color:var(--ink)}
  .bonus{background:var(--bad);color:#fff;font:700 .72rem var(--f-body);padding:.1rem .4rem;letter-spacing:.06em}
  .mid{display:grid;place-items:center;align-content:center;padding:.4rem 1.4rem;background:var(--panel-2);text-align:center;gap:.15rem}
  .mid .clk{font:700 2.2rem/1 var(--f-mono)}
  .mid .per{font:600 .85rem var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
  .mid .run{font:600 .9rem var(--f-body);margin-top:.2rem}

  /* hlavní mřížka */
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr) minmax(0,1fr);gap:.8rem;min-height:0}
  .col{display:flex;flex-direction:column;gap:.7rem;min-height:0;overflow:auto;scrollbar-width:thin}
  .card{background:var(--panel);border:1px solid var(--line);padding:.7rem .85rem}
  .card h2{margin:0 0 .5rem;font:700 .8rem var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);display:flex;align-items:center;gap:.5rem}
  .card h2::before{content:"";width:.7rem;height:.7rem;background:currentColor;flex:none}
  .card h2.us{color:var(--us)} .card h2.them{color:var(--them)}
  .card h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted)}
  .colhead{font:700 1.05rem var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:.3rem 0 .1rem;border-bottom:3px solid currentColor}

  /* hoří */
  .hot{display:grid;gap:.45rem}
  .hotrow{display:grid;grid-template-columns:auto 1fr auto;gap:.1rem .7rem;align-items:center;padding:.35rem .5rem;background:var(--panel-2);border-left:5px solid var(--warn)}
  .hotrow .no{font:700 1.5rem var(--f-mono);min-width:2.2rem}
  .hotrow .who{font-weight:700;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hotrow .why{grid-column:2;font-size:.82rem;color:var(--muted)}
  .hotrow .big{grid-row:1/3;grid-column:3;font:700 1.7rem var(--f-mono);text-align:right}
  .hotrow .big small{display:block;font:500 .66rem var(--f-body);color:var(--muted);text-align:right}
  .via{font-size:.85rem;color:var(--muted);margin-top:.2rem}
  .via b{color:var(--ink)}
  .empty{color:var(--muted);font-size:.9rem;padding:.2rem 0}

  /* fauly */
  .fouls{display:flex;flex-wrap:wrap;gap:.4rem}
  .fchip{display:flex;align-items:center;gap:.5rem;padding:.3rem .6rem;background:var(--panel-2);border:2px solid var(--line);font-weight:700;font-size:1rem}
  .fchip .f{font:700 1.35rem var(--f-mono)}
  .fchip.f3{border-color:var(--warn)} .fchip.f3 .f{color:var(--warn)}
  .fchip.f4{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--panel-2))} .fchip.f4 .f{color:#fff}
  .fchip.f5{border-color:var(--bad);background:var(--bad);color:#fff;opacity:.6;text-decoration:line-through}
  .fchip .oc{width:.55rem;height:.55rem;border-radius:50%;background:var(--good)}
  .fchip .tag{font:700 .7rem var(--f-body);background:var(--ink);color:#222;padding:0 .3rem}

  /* tabulka hráčů */
  table{width:100%;border-collapse:collapse;font-size:.95rem}
  th{font:600 .66rem var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;padding:.25rem .35rem;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:.3rem .35rem;text-align:right;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  th:nth-child(2),td:nth-child(2){text-align:left}
  td.nm{font-family:var(--f-body);font-weight:600;max-width:9rem;overflow:hidden;text-overflow:ellipsis}
  tr.on td{background:color-mix(in srgb,var(--good) 9%,var(--panel))}
  tr.on td:first-child{box-shadow:inset 4px 0 0 var(--good)}
  tr.out td{opacity:.45}
  td.pts{font-weight:700;font-size:1.05rem}
  .dots{display:inline-flex;gap:2px;vertical-align:middle}
  .dots i{width:.55rem;height:.55rem;border-radius:50%;border:1.5px solid var(--miss)}
  .dots i.m{background:var(--good);border-color:var(--good)}
  .dots i.m3{background:var(--warn);border-color:var(--warn)}
  .fx{font-weight:700}
  .fx.f3{color:var(--warn)} .fx.f4,.fx.f5{color:#fff;background:var(--bad);padding:0 .3rem}

  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* ztráty */
  .tov{display:flex;flex-wrap:wrap;gap:.35rem .9rem;font-size:.88rem}
  .tov b{font-family:var(--f-mono)}

  /* střed: mapa */
  .maphead{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:.5rem}
  .mapwrap{position:relative}
  canvas#map{display:block;width:100%;background:var(--court)}
  .sides{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:.5rem}
  .side{background:var(--panel-2);padding:.4rem .5rem;display:grid;gap:.1rem;border-top:4px solid transparent}
  .side.top{border-top-color:var(--warn)}
  .side .l{font:600 .68rem var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .side .v{font:700 1.3rem var(--f-mono)}
  .side .s{font-size:.78rem;color:var(--muted)}
  .side .s b{color:var(--ink);font-family:var(--f-mono)}
  .zones{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:3px}
  .zone{background:var(--panel-2);padding:.3rem .45rem;font-size:.75rem;color:var(--muted)}
  .zone b{display:block;font:700 1rem var(--f-mono);color:var(--ink)}

  /* zdroje bodů */
  .src{display:grid;grid-template-columns:3.2rem 1fr auto 1fr 3.2rem;gap:.3rem .5rem;align-items:center}
  .src .v{font:700 1.35rem var(--f-mono)}
  .src .v.l{text-align:left} .src .v.r{text-align:right}
  .src .lb{font:600 .72rem var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;min-width:7.5rem}
  .src .bar{height:.7rem;background:var(--court);position:relative}
  .src .bar i{position:absolute;top:0;bottom:0}
  .src .bar.l i{right:0;background:var(--us)} .src .bar.r i{left:0;background:var(--them)}
  .src .v.win{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}

  /* sestavy */
  .five{display:grid;gap:.2rem;padding:.45rem .55rem;background:var(--panel-2);border-left:5px solid var(--us)}
  .five.t{border-left-color:var(--them)}
  .five .p{font-weight:600;font-size:.95rem}
  .five .s{font-size:.8rem;color:var(--muted)}
  .five .s b{font-family:var(--f-mono);color:var(--ink)}
  .fives{display:grid;gap:.45rem}

  .load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;font-size:1.1rem;color:var(--muted);text-align:center;padding:2rem}
  .load.hidden{display:none}
  .err{color:var(--bad);font-size:.8rem}

  /* menší displeje: sloupce pod sebe, stránka se posouvá */
  @media (max-width:1099px), (orientation:portrait){
    body{overflow:auto}
    .app{height:auto;min-height:100vh}
    .grid{grid-template-columns:1fr 1fr}
    .col.center{grid-column:1/-1;order:-1}
    .col{overflow:visible}
    html{font-size:clamp(14px,1.9vw,19px)}
  }
  @media (max-width:900px){ .grid{grid-template-columns:1fr} }
  @media (max-width:700px){
    .board{grid-template-columns:1fr auto 1fr}
    .bt{padding:.4rem .5rem;gap:.5rem}
    .bt .nm{font-size:.9rem;white-space:normal}
    .bt .sc{font-size:2.4rem}
    .bt .meta{display:none}
    .mid{padding:.3rem .6rem}
  }
</style>
</head>
<body>
<div class="app">

  <div class="ctl">
    <a class="logo" href="index.html">🐝 Sršni <span>Lavička</span></a>
    <select id="matchSelect"><option value="">Načítám zápasy…</option></select>
    <input id="gid" inputmode="numeric" placeholder="FIBA ID">
    <button id="load">Načíst</button>
    <div class="seg" id="liveSeg"><button data-l="1">Živě</button><button data-l="0">Stop</button></div>
    <span class="err" id="err"></span>
    <span class="status" id="status"><i></i><span id="stTxt">—</span></span>
    <a class="back" href="index.html">plný rozbor →</a>
  </div>

  <div class="board" id="board"></div>

  <div class="grid">
    <div class="col" id="colUs"></div>
    <div class="col center">
      <div class="card">
        <h2>Kam střílí <span class="r" id="mapNote"></span></h2>
        <div class="maphead">
          <div class="seg" id="mapTeam"></div>
          <div class="seg" id="mapRange"></div>
          <div class="seg" id="mapFlip"></div>
        </div>
        <div class="mapwrap"><canvas id="map"></canvas></div>
        <div class="sides" id="sides"></div>
        <div class="zones" id="zones"></div>
      </div>
      <div class="card">
        <h2>Odkud body <span class="r">Sršni · soupeř</span></h2>
        <div class="src" id="src"></div>
      </div>
      <div class="card">
        <h2>Na hřišti teď</h2>
        <div class="fives" id="fives"></div>
      </div>
    </div>
    <div class="col" id="colThem"></div>
  </div>
</div>
<div class="load" id="loadScreen">Načítám zápas…</div>

<script>
const $=id=>document.getElementById(id);
const RECENT=240;          // „teď" = posledních 4 min herního času
const VIA_WIN=300;         // přes koho jdou akce = posledních 5 min
let DATA=null, M=null, US=1, THEM=2, liveTimer=null, currentId=null, lastSig='';
let mapTeam='them', mapRange='all';
let tableBottom=true; try{tableBottom=localStorage.getItem('lav_tableBottom')!=='0';}catch(e){}

/* ---------- načítání (stejné zdroje jako live rozbor) ---------- */
function mojiScore(s){return (s.match(/Ã.|Å.|Â.|â€|Ä.|Ð/g)||[]).length;}
function fixText(s){const b=mojiScore(s);if(!b)return s;let f;try{f=new TextDecoder('utf-8').decode(Uint8Array.from([...s].map(c=>c.charCodeAt(0)&0xff)));}catch(e){return s;}return (mojiScore(f)<b&&!(f.includes('�')&&!s.includes('�')))?f:s;}
function decodeParse(input){let t=typeof input==='string'?input:new TextDecoder('utf-8').decode(input);return JSON.parse(fixText(t));}
const SEASON_URLS=['https://raw.githubusercontent.com/sturcjan-rgb/srsni-data/main/data/season-2026-27.json','https://raw.githubusercontent.com/sturcjan-rgb/srsni-data/main/data/season-2025-26.json'];
const MATCHES={};

async function loadMatchList(){
  const seasons=await Promise.all(SEASON_URLS.map(async u=>{try{const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;return await r.json();}catch(e){return null;}}));
  let html='<option value="">— zápas —</option>',cur=[];
  seasons.forEach((s,i)=>{if(!s)return;const w=(s.fixtures||[]).filter(f=>f.fibaMatchId).sort((a,b)=>new Date(a.datetime)-new Date(b.datetime));if(!w.length)return;
    w.forEach(f=>MATCHES[String(f.fibaMatchId)]=f); if(i===0)cur=w;
    html+='<optgroup label="Sezóna '+s.season+(i?' (archiv)':'')+'">'+w.map(f=>`<option value="${f.fibaMatchId}">${f.date.split('-').reverse().join('.')} · ${f.home} – ${f.away}</option>`).join('')+'</optgroup>';});
  $('matchSelect').innerHTML=html;
  const q=new URLSearchParams(location.search).get('id');
  let id=q;
  if(!id&&cur.length){const now=new Date();const live=cur.find(f=>f.status!=='final'&&now>=new Date(f.datetime)-15*60000&&now<=+new Date(f.datetime)+3*3600000);const past=cur.filter(f=>new Date(f.datetime)<=now);id=String((live||past[past.length-1]||cur[0]).fibaMatchId);}
  if(id){$('matchSelect').value=id;$('gid').value=id;await loadById(id);autoLive(id);}
  else $('loadScreen').textContent='Vyber zápas nahoře nebo zadej FIBA ID.';
}
function autoLive(id){const f=MATCHES[id];if(!f){setLive(false);return;}const s=new Date(f.datetime).getTime(),n=Date.now();setLive(f.status!=='final'&&n>=s-15*60000&&n<=s+3*3600000);}
function setLive(on){
  if(liveTimer){clearInterval(liveTimer);liveTimer=null;}
  if(on)liveTimer=setInterval(()=>{if(currentId)loadById(currentId,true);},3000);
  $('liveSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',(b.dataset.l==='1')===on));
  $('status').classList.toggle('live',on);
}
async function loadById(id,silent){
  if(!/^\d+$/.test(id)){$('err').textContent='Neplatné ID';return;}
  currentId=id; if(!silent)$('err').textContent='';
  const archive=`https://sturcjan-rgb.github.io/srsni-truth/matches/${id}.json`;
  const live=`https://fibalivestats.dcd.shared.geniussports.com/data/${id}/data.json`;
  const liveTries=['https://api.codetabs.com/v1/proxy/?quest='+live,live,'https://corsproxy.io/?url='+encodeURIComponent(live)];
  const tries=silent?[...liveTries,archive]:[archive,...liveTries];
  for(const u of tries){
    try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw 0;const j=decodeParse(await r.arrayBuffer());if(!j.tm)throw 0;
      render(j);$('stTxt').textContent=(u===archive?'archiv':'živě')+' · '+new Date().toLocaleTimeString('cs-CZ');$('err').textContent='';return;}catch(e){}
  }
  if(!silent){$('err').textContent='Zápas '+id+' se nepodařilo načíst.';$('loadScreen').textContent='Zápas se nepodařilo načíst (CORS / ještě nezačal).';}
}
$('load').onclick=()=>{const id=$('gid').value.trim();lastSig='';loadById(id);autoLive(id);};
$('matchSelect').onchange=()=>{const id=$('matchSelect').value;if(!id)return;$('gid').value=id;lastSig='';loadById(id);autoLive(id);};
$('liveSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>setLive(b.dataset.l==='1'));

/* ---------- výpočty ---------- */
const gtSec=s=>{const[m,x]=String(s||'0:0').split(':').map(Number);return m*60+x;};
const pct=(a,b)=>b?100*a/b:0;
const sg=x=>(x>0?'+':'')+x;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function isOurs(t){return /sr[sš]ni|p[ií]sek|photomate/i.test((t.name||'')+' '+(t.shortName||''));}
const TOV={badpass:'špatná přihrávka',ballhandling:'driblink',travel:'kroky',offensive:'útočný faul',outofbounds:'aut',doubledribble:'dvojitý dribling','3sec':'3 s','5sec':'5 s','8sec':'8 s','24sec':'24 s',shotclock:'24 s'};

function analyse(d){
  const pl=d.periodLength||10, otl=d.periodLengthOVERTIME||5;
  const perStart=p=>p<=4?(p-1)*pl*60:4*pl*60+(p-5)*otl*60;
  const perLen=p=>p<=4?pl*60:otl*60;
  const elOf=e=>perStart(e.period)+perLen(e.period)-gtSec(e.gt);
  const pbp=[...(d.pbp||[])].sort((a,b)=>a.actionNumber-b.actionNumber);
  const now=pbp.length?Math.max(...pbp.map(elOf)):0;
  const elBy={};pbp.forEach(e=>elBy[e.actionNumber]=elOf(e));
  const T={1:{},2:{}};
  const P=t=>p=>T[t][p]||(T[t][p]={shots:[],recPts:0,via:0,tags:[],tov:0});
  const on={1:new Set(),2:new Set()};
  [1,2].forEach(t=>{const pls=d.tm[t].pl||{};for(const k in pls)if(pls[k].starter===1)on[t].add(k);});
  const stints={1:{},2:{}}, stintStart={1:0,2:0}, stintScore={1:[0,0],2:[0,0]};
  const tov={1:{},2:{}}, tovRecent={1:0,2:0};
  const scoring=[]; let prevEl=0,ps1=0,ps2=0;
  const key=s=>[...s].map(Number).sort((a,b)=>a-b).join('-');
  for(const e of pbp){
    const el=elOf(e), s1=+e.s1, s2=+e.s2, c1=isNaN(s1)?ps1:s1, c2=isNaN(s2)?ps2:s2;
    const dt=Math.max(0,el-prevEl), dh=c1-ps1, da=c2-ps2;
    for(const t of[1,2])if(on[t].size===5){const k=key(on[t]);const st=stints[t][k]||(stints[t][k]={secs:0,pf:0,pa:0});st.secs+=dt;st.pf+=t===1?dh:da;st.pa+=t===1?da:dh;}
    if(dh||da)scoring.push({el,t:dh>0?1:2,pts:dh||da,s1:c1,s2:c2});
    const t=e.tno, at=e.actionType, p=e.pno?String(e.pno):null, get=(t===1||t===2)&&p?P(t)(p):null;
    const recent=now-el<=RECENT, viaWin=now-el<=VIA_WIN;
    if(get){
      if(at==='2pt'||at==='3pt'){get.shots.push({m:e.success===1,three:at==='3pt',el});if(e.success===1&&recent)get.recPts+=at==='3pt'?3:2;if(viaWin)get.via++;}
      if(at==='freethrow'){if(e.success===1&&recent)get.recPts++;if(viaWin&&/^1of/.test(e.subType||''))get.via++;}
      if(at==='turnover'){if(viaWin)get.via++;get.tov++;}
      if(at==='foul'){const tg={technical:'T',unsportsmanlike:'U',disqualifying:'D'}[e.subType];if(tg)get.tags.push(tg);}
    }
    if(at==='turnover'&&(t===1||t===2)){const k=TOV[e.subType]||'jiné';tov[t][k]=(tov[t][k]||0)+1;if(now-el<=VIA_WIN)tovRecent[t]++;}
    if(at==='substitution'&&(t===1||t===2)){const s=on[t];if(e.subType==='in')s.add(p);else if(e.subType==='out')s.delete(p);stintStart[t]=el;stintScore[t]=[c1,c2];}
    prevEl=el;ps1=c1;ps2=c2;
  }
  // aktuální běh (nepřerušená série bodů)
  let run={t:0,pts:0,opp:0};
  for(let i=scoring.length-1;i>=0;i--){const s=scoring[i];if(!run.t){run.t=s.t;run.pts=s.pts;run.from=s.el;continue;}if(s.t===run.t){run.pts+=s.pts;run.from=s.el;}else break;}
  // skóre za posledních 3 min
  const base=[...scoring].reverse().find(s=>s.el<=now-180)||{s1:0,s2:0};
  const last3={1:ps1-base.s1,2:ps2-base.s2};
  // střely s časem
  const shots={1:[],2:[]};
  [1,2].forEach(t=>(d.tm[t].shot||[]).forEach(s=>shots[t].push({x:s.x,y:s.y,m:s.r===1,three:s.actionType==='3pt',el:elBy[s.actionNumber]??perStart(s.per),per:s.per})));
  const period=d.period||(pbp.length?pbp[pbp.length-1].period:1);
  return {pbp,now,T,on,stints,stintStart,stintScore,tov,tovRecent,run,last3,shots,s:{1:ps1,2:ps2},period,perStart,elOf};
}

/* ---------- vykreslení ---------- */
function render(d){
  const sig=(d.pbp||[]).length+'|'+d.clock+'|'+d.tm[1].score+'|'+d.tm[2].score;
  DATA=d;
  if(sig===lastSig)return; lastSig=sig;
  US=isOurs(d.tm[2])&&!isOurs(d.tm[1])?2:1; THEM=US===1?2:1;
  M=analyse(d);
  $('loadScreen').classList.add('hidden');
  drawBoard(); drawTeamCol(US,'colUs'); drawTeamCol(THEM,'colThem'); drawMapControls(); drawMap(); drawSources(); drawFives();
}
const TM=t=>DATA.tm[t];
const sideCls=t=>t===US?'us':'them';
const shortN=t=>TM(t).shortName||TM(t).name;
function plName(t,p){const x=TM(t).pl[p];return x?(x.familyName||x.name):'#'+p;}
function plNo(t,p){const x=TM(t).pl[p];return x?x.shirtNumber:p;}

function drawBoard(){
  const d=DATA, per=M.period, ot=per>4;
  const clk=d.clock||'—', perTxt=ot?'Prodl. '+(per-4):per+'. čtvrtina';
  const team=(t,right)=>{
    const tm=TM(t), f=+tm.fouls||0, dots=[0,1,2,3,4].map(i=>`<i class="${i<f?'on':''}"></i>`).join('');
    return `<div class="bt${right?' r':''}"><div class="sc ${sideCls(t)}">${M.s[t]}</div><div style="min-width:0">
      <div class="nm ${sideCls(t)}">${esc(tm.name)}</div>
      <div class="meta"><span>Fauly ve čtvrtině <b>${f}</b><span class="tf">${dots}</span></span>${f>=4?'<span class="bonus">BONUS</span>':''}
      <span>Time-out zbývá <b>${tm.timeouts??'—'}</b></span><span>Posl. 3 min <b>${M.last3[t]}</b></span></div></div></div>`;
  };
  const r=M.run, runTxt=r.t&&r.pts>=4?`<span class="${sideCls(r.t)}">Běh ${r.pts}:0 ${esc(shortN(r.t))}</span>`:'<span class="mut">bez běhu</span>';
  $('board').innerHTML=team(US,false)+`<div class="mid"><div class="clk">${clk}</div><div class="per">${perTxt}</div><div class="run">${runTxt}</div></div>`+team(THEM,true);
}

function tsOf(p){const fga=+p.sFieldGoalsAttempted||0,fta=+p.sFreeThrowsAttempted||0;return (fga+fta)?pct(+p.sPoints||0,2*(fga+0.44*fta)):null;}
function drawTeamCol(t,elId){
  const tm=TM(t), cls=sideCls(t), A=M.T[t], onSet=M.on[t];
  // HOŘÍ: body za posl. 4 min + série proměněných
  const hot=Object.keys(tm.pl).map(p=>{const a=A[p]||{shots:[],recPts:0,via:0,tags:[]};
    let streak=0,st3=0;for(let i=a.shots.length-1;i>=0;i--){if(a.shots[i].m)streak++;else break;}
    for(let i=a.shots.length-1;i>=0;i--){if(!a.shots[i].three)continue;if(a.shots[i].m)st3++;else break;}
    return {p,rec:a.recPts,streak,st3,last:a.shots.slice(-5),score:a.recPts+2*streak+2*st3};})
    .filter(h=>h.rec>=4||h.streak>=3||h.st3>=2).sort((a,b)=>b.score-a.score).slice(0,3);
  const hotHtml=hot.length?hot.map(h=>{
    const why=[h.rec?`${h.rec} b. za posl. 4 min`:null,h.streak>=2?`${h.streak}× za sebou`:null,h.st3>=2?`${h.st3} trojky v řadě`:null].filter(Boolean).join(' · ');
    return `<div class="hotrow"><span class="no ${cls}">${esc(plNo(t,h.p))}</span><span class="who">${esc(plName(t,h.p))}${onSet.has(h.p)?' <span class="pos" title="na hřišti">●</span>':''}</span>
      <span class="why">${why} <span class="dots">${h.last.map(s=>`<i class="${s.m?(s.three?'m3':'m'):''}"></i>`).join('')}</span></span>
      <span class="big">${h.rec}<small>body/4 min</small></span></div>`;}).join(''):'<div class="empty">Nikdo teď výrazně nepálí.</div>';
  const via=Object.keys(A).map(p=>({p,v:A[p].via})).filter(x=>x.v>=2).sort((a,b)=>b.v-a.v).slice(0,3);
  const viaHtml=via.length?`<div class="via">Akce jdou přes: ${via.map(x=>`<b>${esc(plName(t,x.p))}</b> ${x.v}×`).join(', ')} <span class="mut">(zakončení + ztráty, posl. 5 min)</span></div>`:'';
  // FAULY
  const fl=Object.keys(tm.pl).map(p=>({p,f:+tm.pl[p].sFoulsPersonal||0,tags:(A[p]||{tags:[]}).tags})).filter(x=>x.f>=2||x.tags.length).sort((a,b)=>b.f-a.f);
  const flHtml=fl.length?fl.map(x=>`<span class="fchip f${Math.min(x.f,5)>=3?Math.min(x.f,5):''}">${onSet.has(x.p)?'<i class="oc" title="na hřišti"></i>':''}<span class="n">${esc(plNo(t,x.p))}</span> ${esc(plName(t,x.p))} <span class="f">${x.f}</span>${[...new Set(x.tags)].map(g=>`<span class="tag">${g}</span>`).join('')}</span>`).join(''):'<div class="empty">Nikdo nemá víc než 1 faul.</div>';
  // TABULKA
  const rows=Object.keys(tm.pl).map(p=>({p,x:tm.pl[p],a:A[p]||{shots:[]},on:onSet.has(p)}))
    .filter(r=>r.on||(r.x.sMinutes&&r.x.sMinutes!=='0:00'&&r.x.sMinutes!=='00:00')||+r.x.sPoints||r.a.shots.length)
    .sort((a,b)=>(b.on-a.on)||((+b.x.sPoints||0)-(+a.x.sPoints||0)));
  const body=rows.map(r=>{const x=r.x,ts=tsOf(x),f=+x.sFoulsPersonal||0,pm=+x.sPlusMinusPoints||0;
    const tsc=ts==null?'mut':((+x.sFieldGoalsAttempted+ +x.sFreeThrowsAttempted)<4?'mut':ts>=60?'pos':ts<45?'neg':'');
    return `<tr class="${r.on?'on':''}${f>=5?' out':''}"><td>${esc(x.shirtNumber)}</td><td class="nm">${esc(x.familyName||x.name)}</td>
      <td>${String(x.sMinutes||'0:00').replace(/^0(\d)/,'$1')}</td><td class="pts">${+x.sPoints||0}</td>
      <td class="${tsc}">${ts==null?'—':Math.round(ts)}</td><td>${+x.sThreePointersMade||0}/${+x.sThreePointersAttempted||0}</td>
      <td><span class="fx f${f>=3?Math.min(f,5):''}">${f}</span></td><td class="${pm>0?'pos':pm<0?'neg':''}">${sg(pm)}</td>
      <td><span class="dots">${r.a.shots.slice(-5).map(s=>`<i class="${s.m?(s.three?'m3':'m'):''}"></i>`).join('')}</span></td></tr>`;}).join('');
  // ZTRÁTY
  const tv=Object.entries(M.tov[t]).sort((a,b)=>b[1]-a[1]);
  const tvTotal=tv.reduce((s,x)=>s+x[1],0);
  $(elId).innerHTML=`<div class="colhead ${cls}">${esc(tm.name)}</div>
    <div class="card"><h2 class="${cls}">Kdo teď dává</h2><div class="hot">${hotHtml}</div>${viaHtml}</div>
    <div class="card"><h2 class="${cls}">Fauly <span class="r">● = na hřišti</span></h2><div class="fouls">${flHtml}</div></div>
    <div class="card"><h2 class="${cls}">Hráči <span class="r">TS% · posl. 5 střel</span></h2>
      <div class="tw"><table><thead><tr><th>#</th><th>Hráč</th><th>Min</th><th>B</th><th>TS%</th><th>3B</th><th>F</th><th>+/−</th><th>Posl. 5</th></tr></thead><tbody>${body}</tbody></table></div></div>
    <div class="card"><h2 class="${cls}">Ztráty <span class="r"><b class="n" style="color:var(--ink)">${tvTotal}</b> celkem · <b class="n" style="color:var(--ink)">${M.tovRecent[t]}</b> za posl. 5 min</span></h2>
      <div class="tov">${tv.map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join('')||'<span class="mut">zatím žádné</span>'}</div></div>`;
}

/* střelecká mapa: pohled z lavičky — koš vlevo, stolek dole (lze otočit) */
function drawMapControls(){
  $('mapTeam').innerHTML=`<button data-v="them" class="${mapTeam==='them'?'on t':''}">${esc(shortN(THEM))}</button><button data-v="us" class="${mapTeam==='us'?'on':''}">${esc(shortN(US))}</button>`;
  const cq=M.period>4?'Prodl.':'Q'+M.period;
  $('mapRange').innerHTML=[['all','Celý zápas'],['q',cq],['r5','Posl. 5 min']].map(([v,l])=>`<button data-v="${v}" class="${mapRange===v?'on':''}">${l}</button>`).join('');
  $('mapFlip').innerHTML=`<button title="Otočit strany podle toho, kde sedí stolek">⇅ stolek ${tableBottom?'dole':'nahoře'}</button>`;
  $('mapTeam').querySelectorAll('button').forEach(b=>b.onclick=()=>{mapTeam=b.dataset.v;drawMapControls();drawMap();});
  $('mapRange').querySelectorAll('button').forEach(b=>b.onclick=()=>{mapRange=b.dataset.v;drawMapControls();drawMap();});
  $('mapFlip').querySelector('button').onclick=()=>{tableBottom=!tableBottom;try{localStorage.setItem('lav_tableBottom',tableBottom?'1':'0');}catch(e){}drawMapControls();drawMap();};
}
function mapShots(){
  const t=mapTeam==='us'?US:THEM;
  return M.shots[t].filter(s=>mapRange==='all'||(mapRange==='q'?s.per===M.period:M.now-s.el<=300)).map(s=>{
    // zrcadlení přes půlku: koš vždy vlevo, strana stolku (y) zůstává
    const x=s.x>50?100-s.x:s.x, y=s.y;
    const dx=(x-5.2)/100*28, dy=(y-50)/100*15, dist=Math.hypot(dx,dy);
    const corner=s.three&&x<13&&Math.abs(y-50)>32;
    const sideK=y>=66.7?'near':y<=33.3?'far':'mid';
    return Object.assign({},s,{x,y,dist,corner,sideK});
  });
}
function drawMap(){
  const t=mapTeam==='us'?US:THEM, col=t===US?'#ffd31a':'#9fc2e0', shots=mapShots();
  const cv=$('map'), wrap=cv.parentElement, W=wrap.clientWidth;
  const maxH=Math.max(200,window.innerHeight*(window.innerWidth>=1100?0.34:0.42));
  const L=14, Wd=15; let w=W, h=W*Wd/L; if(h>maxH){h=maxH;w=h*L/Wd;}
  const dpr=window.devicePixelRatio||1; cv.width=Math.round(W*dpr); cv.height=Math.round(h*dpr); cv.style.height=h+'px';
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,h);
  const ox=(W-w)/2, sx=w/L, sy=h/Wd;
  const X=x=>ox+(x/100*28)*sx, Y=y=>(tableBottom?y:100-y)/100*Wd*sy;
  // pásy stran
  const bands=[['far',0,33.3],['mid',33.3,66.7],['near',66.7,100]];
  const agg={far:{a:0,m:0,a3:0,m3:0,ca:0,cm:0},mid:{a:0,m:0,a3:0,m3:0,ca:0,cm:0},near:{a:0,m:0,a3:0,m3:0,ca:0,cm:0}};
  shots.forEach(s=>{const g=agg[s.sideK];g.a++;if(s.m)g.m++;if(s.three){g.a3++;if(s.m)g.m3++;}if(s.corner){g.ca++;if(s.m)g.cm++;}});
  const maxA=Math.max(1,...Object.values(agg).map(g=>g.a));
  bands.forEach(([k,y0,y1])=>{const g=agg[k];const a=g.a/maxA;ctx.fillStyle=`rgba(255,171,61,${(0.04+0.16*a).toFixed(3)})`;const ya=Y(y0),yb=Y(y1);ctx.fillRect(ox,Math.min(ya,yb),w,Math.abs(yb-ya));});
  // čáry
  ctx.strokeStyle='#77756c';ctx.lineWidth=1.5;ctx.strokeRect(ox+.5,.5,w-1,h-1);
  const hx=X(5.2),hy=Y(50);
  ctx.beginPath();ctx.arc(hx,hy,sx*.23,0,7);ctx.strokeStyle='#ffd31a';ctx.stroke();ctx.strokeStyle='#77756c';
  const kw=4.9*sy,kl=5.8*sx;ctx.strokeRect(ox,hy-kw/2,kl,kw);
  ctx.beginPath();ctx.arc(ox+kl,hy,1.8*sy,-Math.PI/2,Math.PI/2);ctx.stroke();
  ctx.beginPath();ctx.arc(hx,hy,6.75*sx,-1.12,1.12);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox,hy-6.6*sy);ctx.lineTo(ox+2.99*sx,hy-6.6*sy);ctx.moveTo(ox,hy+6.6*sy);ctx.lineTo(ox+2.99*sx,hy+6.6*sy);ctx.stroke();
  ctx.setLineDash([4,5]);ctx.beginPath();ctx.moveTo(ox,Y(33.3));ctx.lineTo(ox+w,Y(33.3));ctx.moveTo(ox,Y(66.7));ctx.lineTo(ox+w,Y(66.7));ctx.stroke();ctx.setLineDash([]);
  // popisek stolku
  ctx.fillStyle='#b9b8b0';ctx.font=`600 ${Math.max(10,h*0.032)}px "Space Grotesk"`;ctx.textAlign='right';
  ctx.fillText('STOLEK / LAVIČKY',ox+w-8,tableBottom?h-8:Math.max(14,h*0.045));
  // střely
  const r=Math.max(4,w*0.0125);
  shots.forEach(s=>{ctx.beginPath();ctx.arc(X(s.x),Y(s.y),r,0,7);if(s.m){ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='#2b2b2b';ctx.lineWidth=1.2;ctx.stroke();}else{ctx.strokeStyle='#9d9c95';ctx.lineWidth=1.8;ctx.stroke();}});
  // karty stran
  const names={near:'Strana stolku',mid:'Střed',far:'Vzdálená strana'};
  const order=tableBottom?['far','mid','near']:['near','mid','far'];
  const top=Object.entries(agg).sort((a,b)=>b[1].a-a[1].a)[0][0];
  $('sides').innerHTML=order.map(k=>{const g=agg[k];return `<div class="side${g.a&&k===top?' top':''}"><span class="l">${names[k]}</span><span class="v">${g.m}/${g.a} <span class="mut" style="font-size:.8rem">${g.a?Math.round(pct(g.m,g.a))+' %':''}</span></span>
    <span class="s">3B <b>${g.m3}/${g.a3}</b>${k!=='mid'?` · roh <b>${g.cm}/${g.ca}</b>`:''}</span></div>`;}).join('');
  const Z=[['U koše',s=>!s.three&&s.dist<1.8],['Krátká / střední',s=>!s.three&&s.dist>=1.8],['Trojka z rohu',s=>s.corner],['Trojka z oblouku',s=>s.three&&!s.corner]];
  $('zones').innerHTML=Z.map(([l,f])=>{const z=shots.filter(f),m=z.filter(s=>s.m).length;return `<div class="zone">${l}<b>${m}/${z.length}${z.length?` <span class="mut" style="font-size:.75rem">${Math.round(pct(m,z.length))}%</span>`:''}</b></div>`;}).join('');
  $('mapNote').textContent=`${shots.length} střel · ${shortN(t)}`;
}

function drawSources(){
  const u=TM(US), o=TM(THEM);
  const S=[['Z lavičky','tot_sBenchPoints'],['Rychlé protiútoky','tot_sPointsFastBreak'],['Po ztrátách','tot_sPointsFromTurnovers'],['Druhá šance','tot_sPointsSecondChance'],['V paintu','tot_sPointsInThePaint']];
  const mx=Math.max(1,...S.flatMap(([,k])=>[+u[k]||0,+o[k]||0]));
  $('src').innerHTML=S.map(([l,k])=>{const a=+u[k]||0,b=+o[k]||0;
    return `<span class="v l us${a>b?' win':''}">${a}</span><span class="bar l"><i style="width:${100*a/mx}%"></i></span><span class="lb">${l}</span><span class="bar r"><i style="width:${100*b/mx}%"></i></span><span class="v r them${b>a?' win':''}">${b}</span>`;}).join('');
}

function drawFives(){
  const out=[US,THEM].map(t=>{
    const on=[...M.on[t]];if(on.length!==5)return `<div class="five${t===THEM?' t':''}"><span class="p mut">Sestava ${esc(shortN(t))} nejde z dat určit.</span></div>`;
    const k=on.map(Number).sort((a,b)=>a-b).join('-'), st=M.stints[t][k]||{secs:0,pf:0,pa:0};
    const since=M.now-M.stintStart[t], [b1,b2]=M.stintScore[t], sf=t===1?M.s[1]-b1:M.s[2]-b2, sa=t===1?M.s[2]-b2:M.s[1]-b1;
    const mm=s=>Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
    return `<div class="five${t===THEM?' t':''}"><span class="p">${on.sort((a,b)=>(+TM(t).pl[a].shirtNumber)-(+TM(t).pl[b].shirtNumber)).map(p=>`<span class="n ${sideCls(t)}">${esc(plNo(t,p))}</span> ${esc(plName(t,p))}`).join(' · ')}</span>
      <span class="s">Od posl. střídání <b>${mm(since)}</b> · skóre <b>${sf}:${sa}</b> · tahle pětka dnes celkem <b>${mm(st.secs)}</b> min, <b class="${st.pf-st.pa>0?'pos':st.pf-st.pa<0?'neg':''}">${sg(st.pf-st.pa)}</b></span></div>`;});
  $('fives').innerHTML=out.join('');
}

let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(M)drawMap();},120);});
loadMatchList();
</script>
